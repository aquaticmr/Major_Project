version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://fino_user:fino_pass@db:5432/finoaddwise
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000"]
    volumes:
      - ./storage:/app/storage
      - ./backend/app/ml/artifacts:/app/backend/app/ml/artifacts
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: fino_user
      POSTGRES_PASSWORD: fino_pass
      POSTGRES_DB: finoaddwise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
